name: Build & Deploy AXIS OBRA na VPS

on:
  push:
    branches:
      - main

jobs:
  build-check:
    name: Validar Build do Projeto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22+
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências e testar build do Frontend
        run: |
          npm --prefix backend install
          npm --prefix frontend install
          npm --prefix frontend run build

      - name: Testes da API
        run: npm --prefix backend test

  deploy-vps:
    name: Atualizar VPS via SSH
    needs: build-check
    runs-on: ubuntu-latest
    env:
      HAS_VPS_HOST: ${{ secrets.VPS_HOST != '' }}
    steps:
      # Só executa o deploy SSH se o segredo VPS_HOST estiver configurado no repositório
      # (o contexto "secrets" não pode ser usado direto no "if" de um job)
      - name: Executar deploy remoto na VPS
        if: env.HAS_VPS_HOST == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_APP_DIR || '/var/www/axis-obra' }}
            chmod +x deploy.sh
            ./deploy.sh
